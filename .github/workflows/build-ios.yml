name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  logic-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run scenario tests (no Firebase needed)
        run: Tests/run_logic_tests.sh

  build:
    runs-on: macos-15
    needs: logic-tests
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Add Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::Add the GOOGLE_SERVICE_INFO_PLIST_BASE64 repository secret (see INSTALL_ON_IPHONE.md)"; exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ProperDisciplineApp/GoogleService-Info.plist

      - name: Check bundle ID matches Firebase plist
        run: |
          PLIST_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ProperDisciplineApp/GoogleService-Info.plist)
          YML_ID=$(grep 'PRODUCT_BUNDLE_IDENTIFIER:' project.yml | awk '{print $2}')
          echo "plist=$PLIST_ID project.yml=$YML_ID"
          if [ "$PLIST_ID" != "$YML_ID" ]; then
            echo "::error::Bundle ID mismatch. Set PRODUCT_BUNDLE_IDENTIFIER in project.yml to $PLIST_ID (or re-register the Firebase iOS app)."; exit 1
          fi

      - name: Generate Xcode project
        run: |
          # Registers Google's sign-in redirect URL scheme from the Firebase plist
          echo "GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ProperDisciplineApp/GoogleService-Info.plist)" >> "$GITHUB_ENV"
          export GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ProperDisciplineApp/GoogleService-Info.plist)
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned device archive
        run: |
          xcodebuild archive \
            -project ProperDisciplineApp.xcodeproj \
            -scheme ProperDisciplineApp \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa (unsigned; you sign it with your Apple ID when installing)
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -qry ProperProductivePigeons.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ProperProductivePigeons-ipa
          path: build/ProperProductivePigeons.ipa
